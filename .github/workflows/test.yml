name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: sudhaus_engen_test
          POSTGRES_PASSWORD: sudhaus_engen
          POSTGRES_USER: sudhaus_engen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sudhaus_engen -d sudhaus_engen_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Bootstrap
        run: script/bootstrap
      - name: Unit tests
        env:
          SUDHAUS_ENGEN_POSTGRES_DSN: postgres://sudhaus_engen:sudhaus_engen@127.0.0.1:5432/sudhaus_engen_test?sslmode=disable
        run: |
          go clean -testcache
          make test
