name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Bootstrap
        run: script/bootstrap
      - name: Verify go.mod is tidy
        run: |
          make tidy
          git diff --exit-code go.mod go.sum
      - run: make build
      - run: make docker-build
